name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -e . -r requirements-dev.txt
      - run: ruff check .
      - run: pytest -q
      - run: python -m build --sdist --wheel
      - run: twine check dist/*
